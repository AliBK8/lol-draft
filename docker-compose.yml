# Dağıtım (DESIGN.md §8.8, UYGULAMA.md §8.20).
#
#   İnternet ─► caddy (80/443, TLS) ─► gateway (8080) ─► api (8080) ─► matches volume (/data/matches.db)
#               ağ: edge               edge + internal    internal          ▲
#                                                                 backup ───┘ ─► backups volume
#
# Sırlar .env'de (repoya girmez; şablon .env.example). Başlat: docker compose up -d --build
name: lol-draft

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp" # HTTP/3
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # sertifikalar ve iç CA: silinirse yeniden alınır (Let's Encrypt sınırlarına dikkat)
      - caddy-config:/config
    networks:
      edge:
        # Sabit IP: gateway X-Forwarded-For'a sadece bu adresten gelirse güvenir (TrustedProxies).
        ipv4_address: 172.28.0.10
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE] # caddy ikilisi bu yetkiyle işaretli; düşürülürse hiç başlamaz
    security_opt: [no-new-privileges:true]
    depends_on: [gateway]

  gateway:
    build:
      context: .
      dockerfile: src/LolDraft.Gateway/Dockerfile
    restart: unless-stopped
    environment:
      GATEWAY_SECRET: ${GATEWAY_SECRET:?.env içinde GATEWAY_SECRET yok}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?.env içinde JWT_SIGNING_KEY yok}
      # Host başlığı beyaz listesi: Caddy'nin sunduğu alan adı (production'da "*" ile açılmaz, GatewaySettings).
      AllowedHosts: ${SITE_ADDRESS:-localhost}
      Gateway__TrustedProxies__0: 172.28.0.10
    networks: [edge, internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on: [api]

  api:
    build:
      context: .
      dockerfile: src/LolDraft.Api/Dockerfile
    restart: unless-stopped
    environment:
      GATEWAY_SECRET: ${GATEWAY_SECRET:?.env içinde GATEWAY_SECRET yok}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?.env içinde JWT_SIGNING_KEY yok}
      MATCH_DB_PATH: /data/matches.db
      MATCH_RETENTION_DAYS: ${MATCH_RETENTION_DAYS:-180}
    volumes:
      - matches:/data
    networks: [internal] # dışa port yok; internal ağın internete çıkışı da yok
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  backup:
    build: deploy/backup
    restart: unless-stopped
    environment:
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-6}
      BACKUP_KEEP: ${BACKUP_KEEP:-28}
    volumes:
      - matches:/data # salt okunur değil: WAL'da okuyucu da -shm dosyasına yazar
      - backups:/backups
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on: [api]

networks:
  edge:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  internal:
    internal: true

volumes:
  matches:
  backups:
  caddy-data:
  caddy-config:
